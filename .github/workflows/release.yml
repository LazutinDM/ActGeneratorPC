name: Build Windows portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Set release version and repository
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -LiteralPath "version.py" -Value "__version__ = `"$Version`"" -Encoding utf8

          $Config = Get-Content -Raw -LiteralPath "update_config.json" | ConvertFrom-Json
          $Config.repository = "${{ github.repository }}"
          $Config | ConvertTo-Json | Set-Content -LiteralPath "update_config.json" -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Check function documentation
        shell: pwsh
        run: python tools/check_function_docs.py

      - name: Run tests
        shell: pwsh
        run: |
          # The complete GUI suite is executed locally before tagging. Running
          # every off-screen window on the hosted runner exceeds its practical
          # release time limit, so CI repeats all non-GUI tests plus the GUI
          # scenarios that protect the packaged release and current features.
          python -m unittest -v `
            tests.test_equipment_registry_update `
            tests.test_excel_export `
            tests.test_history_store `
            tests.test_portable_layout `
            tests.test_ui_icons `
            tests.test_update_manager `
            tests.test_update_rollback
          python -m unittest -v `
            tests.test_ui_smoke.UiSmokeTests.test_main_window_builds_all_primary_controls `
            tests.test_ui_smoke.UiSmokeTests.test_extended_accent_palette_is_available `
            tests.test_ui_smoke.UiSmokeTests.test_legacy_icons_can_be_switched_without_restart `
            tests.test_ui_smoke.UiSmokeTests.test_date_picker_uses_modern_themed_calendar `
            tests.test_ui_smoke.UiSmokeTests.test_russian_context_menu_filter_handles_line_edits `
            tests.test_ui_smoke.UiSmokeTests.test_factory_number_fills_equipment_and_station_from_registry `
            tests.test_ui_smoke.UiSmokeTests.test_form_creates_docx_and_passes_derived_excel_values `
            tests.test_ui_smoke.UiSmokeTests.test_surname_only_button_creates_both_blank_template_types `
            tests.test_ui_smoke.UiSmokeTests.test_open_act_stays_visible_when_batch_mode_is_enabled `
            tests.test_ui_smoke.UiSmokeTests.test_release_version_is_1_0_25

      - name: Build portable ZIP
        shell: pwsh
        run: ./build.ps1 -SingleExeRuntime

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/ActGeneratorPC-portable.zip" `
            --verify-tag `
            --notes ""
