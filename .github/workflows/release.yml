name: Build Windows portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Set release version and repository
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -LiteralPath "version.py" -Value "__version__ = `"$Version`"" -Encoding utf8

          $Config = Get-Content -Raw -LiteralPath "update_config.json" | ConvertFrom-Json
          $Config.repository = "${{ github.repository }}"
          $Config | ConvertTo-Json | Set-Content -LiteralPath "update_config.json" -Encoding utf8

      - name: Build portable ZIP
        shell: pwsh
        run: ./build.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/ActGeneratorPC-portable.zip#ActGeneratorPC portable for Windows" `
            --verify-tag `
            --generate-notes
